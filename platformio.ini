[platformio]
default_envs = esp32-s3-tiny-mic

[env]
platform = espressif32 @ 6.10.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0

[env:esp32-s3-usb]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-tiny-usb]
extends = env:esp32-s3-usb
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv

[env:esp32-s3-tiny-mic]
extends = env:esp32-s3-tiny-usb
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DCHROMECAST_USB_MIC=1
monitor_dtr = 1
monitor_rts = 1

[env:esp32-s3-uart]
board = esp32-s3-devkitc-1

[env:esp32-c3-usb]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3-uart]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv

[env:esp32-uart]
board = esp32dev
board_build.partitions = min_spiffs.csv
